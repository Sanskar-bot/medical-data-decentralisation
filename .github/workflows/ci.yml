name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medvault_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: medvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medvault_user -d medvault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://medvault_user:ci_password@127.0.0.1:5432/medvault_test
      FLASK_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1 ruff==0.17.6 pip-audit bandit
      - name: Ruff (syntax errors and undefined names only)
        run: ruff check --select E9,F63,F7,F82 server portals common
      - name: Pytest
        run: pytest -q -p no:cacheprovider
      - name: pip-audit (report only until dependency prompt is done)
        run: pip-audit -r requirements.txt || true
      - name: Bandit (report only, high severity)
        run: bandit -q -r server portals common -lll || true
      - name: Docker build
        run: docker build -t medvault-ci .
